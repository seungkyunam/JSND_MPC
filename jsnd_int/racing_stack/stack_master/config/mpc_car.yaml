# Integrated speed+steering MPC for the real car (race.launch.xml controller:=mpc).
# Loaded AFTER controller.yaml / dynamic_controller.yaml; only MPC keys live here.
# Speed profile overlays loaded after this file (race.launch mpc_profile:=<name>):
#   mpc_profile_lowspeed.yaml  1.0 m/s, real car (default)
#   mpc_profile_1p5.yaml       1.5 m/s
#   mpc_profile_2p25.yaml      2.25 m/s
#   mpc_profile_3p0.yaml / 4p0 / 5p0   3.0 / 4.0 / 5.0 m/s (staged ramp, step 18)
#   mpc_profile_6p0.yaml / 7p0         6.0 / 7.0 m/s ceiling (VESC speed_max still caps ~5.04 m/s)
#   mpc_profile_exp2mps.yaml   2.0 m/s, wheels-lifted bench experiment only
# Legacy PP/speed settings stay untouched.
controller_manager:
  ros__parameters:
    measure: true
    # 100 Hz target (2026-11-22). race.launch overrides it with mpc_rate_hz (default 100,
    # mpc_rate_hz:=40 = previous rate). The MPC solves every control tick; first-stage dt = 1/rate.
    # PP keeps 50 Hz. simple_mux re-publishes at mux_rate_hz (100 in MPC mode).
    control_loop_rate_hz: 100
    # --- geometry (source: CAR/vehicle_config.yaml + mpc-build.vehicle-assets/vehicle.json,
    #     geometry_confirmed=true there) ---
    wheelbase: 0.324
    mpc_pose_to_rear_axle_m: 0.0      # /car_state/odom pose is the rear axle
    mpc_geometry_confirmed: true
    # --- actuator limits: servo mechanical limit / wheel angle still UNMEASURED. ---
    # 2026-11-22 (step 12): max steer 0.15 -> 0.4 rad = legacy FTG (ftg_max_steer) and
    #   manual (joy_max_steer) limit already used on this car. Servo = 0.487 -/+ 0.99*0.4
    #   = 0.091..0.883, inside servo_min/max 0..1 (0..1 <=> +0.492/-0.518 rad); PP uses 0.53.
    # Rate 0.3 rad/s kept (2026-11-20 bench value). Offline 11_18_6 lap at 1.0 m/s with
    #   0.4/0.3: max |steer| 0.336, rate saturates at 0.3, max lateral error 0.05 m (same as
    #   3.2 rad/s). Real servo lag / localisation jumps not modelled -> verify on the car.
    mpc_max_steer_rad: 0.4
    # 2026-11-23 step 23: 0.3 -> 3.2 rad/s. 0.3 was a wheels-lifted bench value, not a servo
    #   limit (PP on this car already commands up to 0.4 rad per 20 ms tick). Offline 11_18_6
    #   (jsnd speed source): with 0.3 the corner steering lags and 60 ms servo dead time /
    #   2 cm pose noise give 0.25-0.31 m lateral error; 3.2 (F1TENTH sim sv_max) -> 0.018-0.025 m.
    #   Real servo rate still UNMEASURED: lower this if the measured rate is below 3.2.
    mpc_max_steer_rate_radps: 3.2
    # --- step 23 architecture: speed = legacy JSND pipeline (raceline x sector scaling ->
    #     /local_waypoints -> PP lookahead speed, lat/heading error scaling, trailing, AEB),
    #     MPC = steering only. 'integrated' restores the previous joint speed+steering MPC
    #     (its keys below: max_accel/decel/lateral_accel/braking_preview/horizon/cmd_max_lead). ---
    mpc_speed_source: jsnd
    mpc_steer_horizon: 15             # 1 x control dt + 14 x 0.05 s = 0.72 s preview
    mpc_steer_preview_dt: 0.05
    mpc_plan_lateral_accel_limit_mps2: 4.5   # ggv ay_max (CAR/veh_dyn_info/ggv.csv); plan check only
    mpc_fallback_max_s: 0.2           # solver miss -> PP steering up to 0.2 s, then STOP
    # 2026-11-23 real-car 3p0: steering diverged + outside_heading_envelope 1.1 s after RB.
    #   Offline: >=120 ms pose delay reproduces it (PP unaffected); 0.1 s prediction removes it
    #   for 0..200 ms delay. Real PF/odom latency NOT measured yet.
    # 2026-11-25 step 49: 0.1 -> 0.18 s = pose delay + servo dead time (the command acts on the
    #   car ~60 ms after it is sent; 0.1 covered the pose part only). Used together with
    #   mpc_history_prediction:=true (step45_run.sh mpc), which integrates the ACTUAL command
    #   history over this window instead of the last command only. Offline 11_18_6 5p0, 140 ms
    #   pose delay + 60 ms servo: corner entry yaw-rate overshoot 1.22 -> 1.06, mid/exit
    #   undershoot 0.61/0.78 -> 1.02/0.97, max |d| 0.46 -> 0.16 m. Also used by the jsnd
    #   steering-only mode. Rollback: 0.1 here + mpc_history_prediction:=false (restart only).
    mpc_latency_comp_s: 0.18
    # --- speed envelope ---
    # mpc_max_speed_mps: operator ceiling from the mpc_profile overlay (lowspeed 1.0 ... 5p0 5.0).
    # jsnd mode: min(JSND speed command, this). The 11_18_6 plan peaks at 3.9 m/s (2.3 in the
    # 0.6-scaled sectors), so 4p0/5p0 never bind there. Keys below up to braking_preview are
    # used only by mpc_speed_source: integrated.
    mpc_max_speed_mps: 1.0            # profile overlay sets the active value (2.0 only in mpc_profile_exp2mps.yaml)
    # 2026-11-24 step 26 (integrated only): vehicle g-g limits of this car = CAR/veh_dyn_info
    #   ggv.csv / ax_max_machines / b_ax_max_machines (ax 5.0, ay 4.5), the model the 11_18_6
    #   raceline that PP drives is optimised with (was 1.0/2.0/2.0 bench values, no measurement).
    #   Braking preview 0.3 -> 1.0 (full D on the friction ellipse, no extra reduction).
    #   Real-car demonstrated ay (PP, unscaled sectors) ~3.3: lower max_lateral_accel to 3.3 if
    #   the car slides. VESC/servo hardware limits are NOT changed by these keys.
    mpc_max_accel_mps2: 5.0
    mpc_max_decel_mps2: 5.0
    mpc_max_lateral_accel_mps2: 4.5
    mpc_braking_preview_ratio: 1.0
    # --- solver budget ---
    # 2026-11-22 bench: max_iter 400 was the cause of the permanent
    # "osqp: maximum iterations reached" lock (standstill QPs need 500-3300 ADMM
    # iterations from a cold start, ~2 us each). The wall-clock time limit is the
    # real budget now; deadline <= 1/control_loop_rate_hz is enforced at startup.
    # 2026-11-24 step 30 (integrated): 10 x 0.1 s -> 12 x 0.05 s (0.02 + 11 x 0.05 = 0.57 s),
    #   50 Hz control kept. Offline 11_18_6 5p0 (2 cm pose / 0.05 m/s noise, 60 ms servo delay,
    #   race.launch budgets): STOP 1 -> 0, flying-lap max |d| 0.162 -> 0.089 m, MPC p99
    #   11.4 -> 8.5 ms. 15 x 0.1 s / 20 x 0.05 s exceed the 7.9 m local window or the budget.
    #   r_rate 1/2/4/8 compared: 2.0 kept (8.0 = fewer steering reversals, +0.02 m error).
    mpc_horizon: 12
    mpc_preview_dt: 0.05
    mpc_max_iter: 4000
    mpc_solver_time_limit_s: 0.004
    mpc_deadline_s: 0.008
    # 2026-11-25 step 48: 8 -> 16 (corner-exit left/right swing: d +-0.4 m, steer -0.31..+0.40 in the
    #   14:30 bag; offline with 140 ms pose delay + 0.15 m hairpin pose bias: max |d| 0.52 -> 0.33-0.39).
    mpc_q_heading: 16.0
    # step 48: 0.15 (default) -> 0.05. a^2 penalty was the straight-line bottleneck: offline flying-lap
    #   max 3.30 -> 3.69 m/s (raceline 3.9), lap 5.38 -> 5.20 s; same accel/decel/friction limits.
    mpc_r_accel: 0.05
    # 2026-11-25 step 47: 2.0 -> 3.0 (straight-line left/right steering oscillation; also used by
    #   the jsnd steering-only MPC). Rollback: 2.0 here (yaml is symlinked into install, restart only).
    mpc_r_rate: 3.0
    # Opt-in for fixed-time, variable-N profiles. State/input terms are integrated
    # in time and steering-increment cost is normalized by step duration.
    mpc_time_scaled_objective: false
    # --- step 47 corner entry/exit (integrated only, 0 = step 46 behaviour) ---
    mpc_brake_lead_s: 0.12        # curvature speed cap applied 0.12*v m earlier (VESC speed-loop lag); lowers caps only
    mpc_speed_response_tau_s: 0.12 # lap_sim/VESC first-order speed response; shared by envelope and command conversion
    mpc_steer_preview_s: 0.03     # steering feed-forward/linearisation sampled 0.03*v m ahead
    mpc_accel_jerk_mps3: 20.0     # corner-exit acceleration ramp (0 -> 5 m/s^2 in 0.25 s); braking never limited
    # --- acceleration -> VESC speed setpoint ---
    mpc_cmd_max_lead_mps: 0.5         # setpoint may lead measured odom speed by at most this
    mpc_cmd_accel_lead_mps: 1.2       # step 52: lead while a solved plan only accelerates (straights); 0 = off
    mpc_static_approach_decel_mps2: 1.5  # TRAILING static obstacle: cap = sqrt(crawl^2 + 2*a*(gap-standoff)) (0 = old flat crawl cap)
    mpc_envelope_recovery_speed_mps: 0.5  # stopped outside heading envelope: PP creep back to the path (0 = old permanent STOP)
    mpc_odom_timeout_s: 0.2           # stale /car_state/odom -> 0 speed
    # --- existing FTG (FTGONLY) is unchanged; only its speed cap is lowered for first runs ---
    ftg_max_speed: 1.0                # controller.yaml keeps 2.0 for PP mode
