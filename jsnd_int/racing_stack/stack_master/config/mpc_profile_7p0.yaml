# 7.0 m/s operator ceiling. Load with mpc_profile:=7p0. Prepared only, not driven.
# Copy of mpc_profile_5p0.yaml with only the MPC speed cap raised; accel/decel, lateral accel,
# steering 0.4 rad and steering rate, curvature slow-down, waypoint speed caps, A latch/estop unchanged.
# NOTE: the downstream VESC driver clips to 23250 ERPM / 4614 = 5.039 m/s
# (vehicle_config.yaml, unchanged); real speed must be read from odom.
controller_manager:
  ros__parameters:
    mpc_max_speed_mps: 7.0
