# c16bced final one-second obstacle profile. In the final vehicle branch this is
# loaded after the existing staged speed-ceiling file. It intentionally does not
# set mpc_max_speed_mps: the selected lowspeed through 10p0 overlay remains the operator gate.
# Objective weights and physical limits are not tuned here beyond the validated
# c16bced configuration.
controller_manager:
  ros__parameters:
    mpc_speed_source: integrated
    mpc_horizon: 10
    mpc_preview_dt: 0.10888888888888888
    mpc_preview_grid_power: 1.5
    mpc_time_scaled_objective: true
    mpc_time_weighted_accel_cost: false
    mpc_q_position: 20.0
    mpc_q_speed: 20.0
    mpc_r_accel: 0.05
    mpc_braking_recovery_max_mps: 1.0
    mpc_lateral_plan_fraction: 0.85
    mpc_brake_lead_s: 0.08
    mpc_steer_preview_s: 0.03
    mpc_cmd_accel_lead_mps: 1.2
